<body class="bg-pitch-deep text-on-surface min-h-screen flex items-center justify-center relative p-margin-mobile md:p-margin-desktop overflow-hidden">
<!-- Subtle Background Texture/Image for Premium Feel -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none mix-blend-overlay" data-alt="A dark, abstract, high-tech background suitable for a premium sports club backoffice login. Deep pitch-blue tones dominate the scene, with very subtle, out-of-focus geometric stadium lighting elements in the distance. The lighting is moody and professional, establishing a secure, corporate-modern aesthetic. A faint, precise grid texture overlays the darkness, reinforcing a data-driven, athletic management environment." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBzif2Rgpe5v-G5iXdlHPUcDkKYKX_MPiGUkeC8A_Ll7UnEMUgDsacTEDllvlPQNsHTV-TmlY8ia0Qkb3GyPrCgBeCninh8Zb6iFwlimvi_6x6fAMhdQ8AilWk_QTs9gVSgyRLcw5RxefPj0bVWONPAycK-mQ8cKm-TIxVBRD8uBcxXEv15ka567pOTetEOSUz59T_RP04Nfhb32J0Vtev6I0_ssLFYLivIQuQrN3P_il6MCpXCw9kUHlrpT0fREuwQKNIKklfYynI'); background-size: cover; background-position: center;">
</div>
<!-- Gradient Overlay to ensure text readability and focus -->
<div class="absolute inset-0 z-0 bg-gradient-to-b from-pitch-deep/80 to-pitch-deep pointer-events-none"></div>
<!-- Main Login Container -->
<main class="relative z-10 w-full max-w-[480px] bg-stadium-blue border border-outline-variant/30 rounded-xl shadow-2xl backdrop-blur-sm flex flex-col overflow-hidden">
<!-- Top Bolt Accent Line -->
<div class="h-1 w-full bg-bolt-gold"></div>
<div class="p-stack-lg md:p-[48px] flex flex-col gap-stack-lg">
<!-- Header Section -->
<header class="flex flex-col items-center text-center gap-stack-sm mb-stack-sm">
<!-- Icon/Crest Placeholder -->
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center border border-outline-variant/50 mb-2">
<span class="material-symbols-outlined text-bolt-gold" data-icon="admin_panel_settings" style="font-size: 32px;">admin_panel_settings</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-bolt-gold tracking-tighter">
                    RISING RAIMON
                </h1>
<h2 class="font-body-lg text-body-lg text-on-surface-variant">
                    Área Privada de Gestión
                </h2>
</header>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Identifier Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2" for="identifier">
<span class="material-symbols-outlined text-[16px]" data-icon="person">person</span>
                        Usuario / Email
                    </label>
<input class="w-full bg-surface-container border border-outline-variant/50 rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-bolt-gold focus:ring-1 focus:ring-bolt-gold transition-colors" id="identifier" name="identifier" placeholder="Introduce tu credencial" required="" type="text"/>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2" for="password">
<span class="material-symbols-outlined text-[16px]" data-icon="lock">lock</span>
                        Contraseña
                    </label>
<input class="w-full bg-surface-container border border-outline-variant/50 rounded-DEFAULT px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-bolt-gold focus:ring-1 focus:ring-bolt-gold transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Action Button -->
<button class="mt-stack-sm w-full bg-bolt-gold text-pitch-deep font-label-caps text-label-caps py-4 px-6 rounded-DEFAULT flex items-center justify-center gap-2 hover:-translate-y-0.5 hover:shadow-[0_0_15px_rgba(253,203,88,0.25)] active:scale-95 transition-all duration-300" type="submit">
                    ACCEDER AL SISTEMA
                    <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Security Notice -->
<div class="mt-stack-md pt-stack-md border-t border-outline-variant/20 flex items-start gap-3 text-on-surface-variant opacity-80">
<span class="material-symbols-outlined text-[16px] shrink-0 mt-0.5" data-icon="info">info</span>
<p class="font-body-md text-[13px] leading-tight">
                    Acceso restringido exclusivamente a personal autorizado. Toda actividad en esta plataforma es monitorizada por motivos de seguridad corporativa.
                </p>
</div>
</div>
